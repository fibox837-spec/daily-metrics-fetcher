name: Daily Metrics Aggregator

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      start_page:
        description: 'Start Page (e.g. 1)'
        required: false
        default: '1'
      end_page:
        description: 'End Page (e.g. 5)'
        required: false
        default: '5'

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Stealth Aggregator
        run: node aggregate.js
        env:
          HEADLESS: "true"
          START_PAGE: ${{ github.event.inputs.start_page || '1' }}
          END_PAGE: ${{ github.event.inputs.end_page || '5' }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
          exclude_assets: "node_modules,package-lock.json,.github,aggregate.js"
